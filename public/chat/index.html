<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JINE · K-Net</title><style>
@font-face{font-family:PixelMplus;src:url(https://cdn.jsdelivr.net/gh/itouhiro/PixelMplus@master/PixelMplus12-Regular.ttf);font-display:swap}
@font-face{font-family:Zpix;src:url(https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@master/dist/zpix.woff2);font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#f9e3fb;font-family:Zpix,PixelMplus,monospace;color:#3815c9}.window{height:min(96dvh,840px);width:min(96%,740px);margin:2dvh auto;border:4px solid #3621eb;box-shadow:inset 0 0 0 3px #c4e5ff;background:#ef9bf0;display:flex;flex-direction:column}.bar{background:#d9b6f6;border-bottom:3px solid #3621eb;height:33px;padding:3px 8px;display:flex;justify-content:space-between;font-size:20px}.gate{margin:auto;text-align:center;padding:24px}.gate h1{font-size:25px}.gate input,.send input{font:inherit;border:2px solid #3621eb;padding:10px;min-width:0}.gate button,.send button{font:inherit;border:2px solid #2512a3;background:#3f27de;color:white;padding:10px;cursor:pointer}.error{color:#8d145e;min-height:1.4em;font-size:13px}.gate a{color:inherit;font-size:13px}#room{display:none;flex:1;min-height:0;flex-direction:column}#messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:20px;background:linear-gradient(#f19cf1d9,#f19cf1d9),url('/images/background.webp') center/cover}.msg{display:flex;align-items:flex-end;gap:8px;max-width:87%}.msg.them{align-self:flex-start}.msg.me{align-self:flex-end;flex-direction:row-reverse}.square{background:#2854ac;width:28px;height:28px;flex:0 0 28px;border:2px solid #1c168b}.bubble{background:#c6dfef;border-radius:7px;padding:9px 12px;font-size:18px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.me .bubble{background:#42f174}.time{font-size:10px;white-space:nowrap}.send{display:flex;gap:8px;padding:10px;background:#dec4fa;border-top:3px solid #3621eb}.send input{flex:1}.senderror{background:#dec4fa;padding:0 10px}@media(max-width:600px){.window{width:100%;height:100dvh;margin:0;border-width:2px}#messages{padding:12px}.msg{max-width:96%}.bubble{font-size:15px}}
.date-sep{text-align:center;background:#e2bbf1;color:#4021b5;padding:5px;margin:8px auto;font-size:12px}.upload{display:flex;gap:8px;background:#dec4fa;padding:8px;border-top:1px solid #7359d0}.upload input{min-width:0;width:100%;font:inherit;font-size:11px}.upload button{font:inherit}.file-link{color:#3220c3}.msg,.bubble{min-width:0}.bubble{max-width:min(100%,360px);overflow:hidden}.chat-image{display:block;width:auto;height:auto;max-width:100%;max-height:320px;object-fit:contain;border-radius:4px}.image-link{display:block;max-width:100%;text-decoration:none}.image-caption{display:block;font-size:11px;margin-top:5px;overflow-wrap:anywhere}.image-link:focus-visible{outline:3px solid #3923d2}@media(max-width:600px){.bubble{max-width:min(100%,70vw)}.chat-image{max-height:240px}}</style></head><body><main class="window"><div class="bar"><span>▣ JINE</span><span>▁ ▣ ☒</span></div><section class="gate" id="gate"><h1>whats my password?</h1><form id="login"><input id="password" type="password" required aria-label="Password" autocomplete="off"><button>enter ↵</button></form><p class="error" id="login-error" role="alert"></p><a href="/">← K-Net</a> · <a href="/chat/admin/">✧ secret secret</a></section><section class="gate" id="name-gate" style="display:none"><h1>your JINE account</h1><p id="account-hint">Create an account or sign in on another device.</p><p><button id="mode-register" type="button" aria-pressed="true">Create account</button> <button id="mode-login" type="button" aria-pressed="false">Log in</button> <button id="mode-temp" type="button" aria-pressed="false">Temporary account</button></p><form id="name-form" novalidate><div><input id="nickname" type="text" required maxlength="16" placeholder="Username · 1–16 letters/numbers" aria-label="Username" autocomplete="username"></div><div id="account-password-wrap" style="margin-top:10px"><input id="account-password" type="password" required minlength="8" maxlength="128" placeholder="Your password · minimum 8 characters" aria-label="Account password" autocomplete="new-password"></div><p><button id="account-submit" type="submit">Create account ↵</button></p></form><p class="error" id="name-error" role="alert"></p></section><section id="room"><div style="background:#dec4fa;padding:5px 12px;text-align:right"><button id="rename" type="button" style="font:inherit">change name</button></div><div id="messages" role="log" aria-label="Anonymous messages"></div><form class="send" id="send"><input id="message" aria-label="Message" maxlength="400" required placeholder="message..."><button>send ↵</button></form><form class="upload" id="upload"><input id="attachment" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/avif" required><button>upload</button></form><p class="error senderror" id="send-error" role="status"></p><a href="/chat/admin/" style="font-size:11px;text-align:right;padding:4px 12px;color:#6555b1;background:#dec4fa">✧ moderator entrance</a></section></main><script>
const $=q=>document.querySelector(q), room=$("#room"),gate=$("#gate"),nameGate=$("#name-gate"),list=$("#messages");
let last=null,timer=null;
async function api(url,options={}){const r=await fetch(url,{credentials:"same-origin",cache:"no-store",...options});const j=await r.json();if(!r.ok){const error=new Error(j.error||"Request failed");error.status=r.status;throw error}return j}
const post=(url,data)=>api(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(data)});
function stage(which){gate.style.display=which==="password"?"block":"none";nameGate.style.display=which==="name"?"block":"none";room.style.display=which==="room"?"flex":"none";if(which!=="room"){clearInterval(timer);timer=null}}
async function status(){try{const me=await api("/api/me");if(me.needsName){stage("name");$("#nickname").focus()}else{stage("room");await refresh();if(!timer)timer=setInterval(refresh,4000)}}catch(e){stage("password");if(e.status!==401)$("#login-error").textContent=e.message}}
async function refresh(){try{const j=await api("/api/chat");const ids=j.messages.map(m=>m.id+"-"+m.name).join(",");if(ids===last)return;last=ids;const nearBottom=list.scrollHeight-list.scrollTop-list.clientHeight<140;list.replaceChildren();let day="";for(const m of j.messages){const d=new Date(m.created).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});if(day!==d){day=d;const sep=document.createElement("div");sep.className="date-sep";sep.textContent=d;list.append(sep)}const el=document.createElement("div");el.className="msg "+(m.mine?"me":"them");if(!m.mine){const sq=document.createElement("span");sq.className="square";sq.style.backgroundColor=m.shade||"#2854ac";el.append(sq)}const b=document.createElement("div");b.className="bubble";if(m.fileid){const a=document.createElement("a");a.href="/api/file?id="+encodeURIComponent(m.fileid);a.className="file-link";const file=m.filename||"file";if(/\.(png|jpe?g|gif|webp|avif)$/i.test(file)){a.className="image-link";a.target="_blank";a.rel="noopener noreferrer";const img=document.createElement("img");img.src=a.href;img.alt="Image by "+(m.name||"Anonymous")+": "+file;img.className="chat-image";img.loading="lazy";a.append(img);const caption=document.createElement("span");caption.className="image-caption";caption.textContent=file;a.append(caption)}else a.textContent="Download: "+file;b.append(a)}else b.textContent=m.body;const info=document.createElement("small");info.className="time";info.textContent=(m.name||"Anonymous")+" · "+new Date(m.created).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});el.append(b,info);list.append(el)}if(nearBottom)list.scrollTop=list.scrollHeight}catch(e){if(e.status===401||e.status===409)await status();else $("#send-error").textContent=e.message}}
$("#login").addEventListener("submit",async e=>{e.preventDefault();$("#login-error").textContent="";try{await post("/api/login",{password:$("#password").value});$("#password").value="";await status()}catch(err){$("#login-error").textContent=err.message}});
let accountMode="register";
function setAccountMode(mode){
 if(!["register","login","temp"].includes(mode))return;
 accountMode=mode;
 for(const key of ["register","login","temp"])$("#mode-"+key).setAttribute("aria-pressed",String(mode===key));
 const temporary=mode==="temp",pass=$("#account-password");
 $("#account-password-wrap").hidden=temporary;
 pass.required=!temporary;
 pass.disabled=temporary;
 if(temporary)pass.value="";
 pass.setAttribute("autocomplete",mode==="register"?"new-password":"current-password");
 $("#account-submit").textContent=temporary?"Enter as guest ↵":mode==="register"?"Create account ↵":"Log in ↵";
 $("#account-hint").textContent=temporary?"Choose a temporary name. No personal password; the guest session ends when your browser session closes or after 12 hours.":mode==="register"?"New here? Pick a unique username and personal password.":"Welcome back! Use your existing username and password.";
 $("#name-error").textContent="";
}
for(const mode of ["register","login","temp"])$("#mode-"+mode).addEventListener("click",()=>setAccountMode(mode));
$("#name-form").addEventListener("submit",async e=>{
 e.preventDefault();
 const username=$("#nickname").value.trim(),password=$("#account-password").value,err=$("#name-error"),submit=$("#account-submit");
 err.textContent="";
 if(!/^[A-Za-z0-9]{1,16}$/.test(username)){err.textContent="Username must contain 1–16 ASCII letters or numbers";return}
 if(accountMode!=="temp"&&(password.length<8||password.length>128)){err.textContent="Password must be 8–128 characters";return}
 submit.disabled=true;
 try{
  if(accountMode==="temp")await post("/api/temp",{username});
  else await post("/api/account",{username,password,action:accountMode});
  $("#account-password").value="";
  $("#nickname").value="";
  last=null;
  await status();
 }catch(error){err.textContent=error.message}
 finally{submit.disabled=false}
});
setAccountMode("register");
$("#rename").textContent="switch account";
$("#rename").addEventListener("click",async()=>{if(!confirm("Sign out of this account? You can log back in using your username and password."))return;try{await post("/api/logout",{});last=null;await status()}catch(e){$("#send-error").textContent=e.message}});
$("#send").addEventListener("submit",async e=>{e.preventDefault();const input=$("#message");if(!input.value.trim())return;try{await post("/api/chat",{message:input.value});input.value="";$("#send-error").textContent="";await refresh();list.scrollTop=list.scrollHeight}catch(err){$("#send-error").textContent=err.message}});
$("#upload").addEventListener("submit",async e=>{e.preventDefault();const input=$("#attachment");if(!input.files[0])return;const fd=new FormData();fd.append("file",input.files[0]);try{await api("/api/upload",{method:"POST",body:fd});input.value="";$("#send-error").textContent="";await refresh();list.scrollTop=list.scrollHeight}catch(err){$("#send-error").textContent=err.message}});
status();
</script></body></html>
