<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JINE · K-Net</title><style>
@font-face{font-family:PixelMplus;src:url(https://cdn.jsdelivr.net/gh/itouhiro/PixelMplus@master/PixelMplus12-Regular.ttf);font-display:swap}
@font-face{font-family:Zpix;src:url(https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@master/dist/zpix.woff2);font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#f9e3fb;font-family:Zpix,PixelMplus,monospace;color:#3815c9}.window{height:min(96dvh,840px);width:min(96%,740px);margin:2dvh auto;border:4px solid #3621eb;box-shadow:inset 0 0 0 3px #c4e5ff;background:#ef9bf0;display:flex;flex-direction:column}.bar{background:#d9b6f6;border-bottom:3px solid #3621eb;height:33px;padding:3px 8px;display:flex;justify-content:space-between;font-size:20px}.gate{margin:auto;text-align:center;padding:24px}.gate h1{font-size:25px}.gate input,.send input{font:inherit;border:2px solid #3621eb;padding:10px;min-width:0}.gate button,.send button{font:inherit;border:2px solid #2512a3;background:#3f27de;color:white;padding:10px;cursor:pointer}.error{color:#8d145e;min-height:1.4em;font-size:13px}.gate a{color:inherit;font-size:13px}#room{display:none;flex:1;min-height:0;flex-direction:column}#messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:20px;background:linear-gradient(#f19cf1d9,#f19cf1d9),url('/images/background.webp') center/cover}.msg{display:flex;align-items:flex-end;gap:8px;max-width:87%}.msg.them{align-self:flex-start}.msg.me{align-self:flex-end;flex-direction:row-reverse}.square{background:#2854ac;width:28px;height:28px;flex:0 0 28px;border:2px solid #1c168b}.bubble{background:#c6dfef;border-radius:7px;padding:9px 12px;font-size:18px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.me .bubble{background:#42f174}.time{font-size:10px;white-space:nowrap}.send{display:flex;gap:8px;padding:10px;background:#dec4fa;border-top:3px solid #3621eb}.send input{flex:1}.senderror{background:#dec4fa;padding:0 10px}@media(max-width:600px){.window{width:100%;height:100dvh;margin:0;border-width:2px}#messages{padding:12px}.msg{max-width:96%}.bubble{font-size:15px}}
</style></head><body><main class="window"><div class="bar"><span>▣ JINE</span><span>▁ ▣ ☒</span></div><section class="gate" id="gate"><h1>whats my password?</h1><form id="login"><input id="password" type="password" required aria-label="Password" autocomplete="off"><button>enter ↵</button></form><p class="error" id="login-error" role="alert"></p><a href="/">← K-Net</a></section><section id="room"><div id="messages" role="log" aria-label="Anonymous messages"></div><form class="send" id="send"><input id="message" aria-label="Message" maxlength="400" required placeholder="message..."><button>send ↵</button></form><p class="error senderror" id="send-error" role="status"></p></section></main><script>
const room=document.querySelector('#room'),gate=document.querySelector('#gate'),list=document.querySelector('#messages');let last=null,timer=null;
async function api(url,options){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...options}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function refresh(){try{const j=await api('/api/chat');gate.style.display='none';room.style.display='flex';const ids=j.messages.map(x=>x.id).join(',');if(ids===last)return;last=ids;const bottom=list.scrollHeight-list.scrollTop-list.clientHeight<140;list.replaceChildren();for(const m of j.messages){const el=document.createElement('div');el.className='msg '+(m.mine?'me':'them');if(!m.mine){const square=document.createElement('span');square.className='square';square.style.backgroundColor=m.shade;el.append(square)}const b=document.createElement('div');b.className='bubble';b.textContent=m.body;const t=document.createElement('small');t.className='time';t.textContent=new Date(m.created).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});el.append(b,t);list.append(el)}if(bottom)list.scrollTop=list.scrollHeight}catch(e){if(e.message==='Login required'){gate.style.display='block';room.style.display='none';clearInterval(timer);timer=null;}}}
document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const err=document.querySelector('#login-error');err.textContent='';try{await api('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});document.querySelector('#password').value='';await refresh();if(!timer)timer=setInterval(refresh,4000)}catch(x){err.textContent=x.message}});
document.querySelector('#send').addEventListener('submit',async e=>{e.preventDefault();const i=document.querySelector('#message'),err=document.querySelector('#send-error');if(!i.value.trim())return;try{await api('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:i.value})});i.value='';err.textContent='';await refresh();list.scrollTop=list.scrollHeight}catch(x){err.textContent=x.message}});
refresh().then(()=>{if(room.style.display==='flex'&&!timer)timer=setInterval(refresh,4000)});
</script></body></html>
