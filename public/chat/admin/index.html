<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JINE · MOD</title><style>
@font-face{font-family:PixelMplus;src:url(https://cdn.jsdelivr.net/gh/itouhiro/PixelMplus@master/PixelMplus12-Regular.ttf);font-display:swap}@font-face{font-family:Zpix;src:url(https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@master/dist/zpix.woff2);font-display:swap}
*{box-sizing:border-box}body{background:#eba5f4;color:#3319bb;font-family:Zpix,PixelMplus,monospace;margin:0;padding:20px}.window{max-width:750px;margin:20px auto;border:4px double #3216d3;background:#e9dcfc;min-height:65vh}.bar{background:#c3b5f8;border-bottom:3px solid #3216d3;padding:8px 12px;font-size:20px}main{padding:18px}h1{font-size:20px}button,input{font:inherit;padding:9px;border:2px solid #3725c3}button{background:#3c29c5;color:white;cursor:pointer}button:focus-visible{outline:3px solid #ed72e7}.hidden{display:none}.entry{border:2px solid #a8a5ea;background:#fff8;margin:9px 0;padding:10px;overflow-wrap:anywhere}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.muted{font-size:12px;color:#706bb6}.error{color:#a31d59}a{color:#4632af}@media(max-width:600px){body{padding:5px}.window{margin:0}main{padding:10px}}
</style></head><body><section class="window"><div class="bar">▣ JINE — MODERATOR</div><main><p><a href="/chat/">← back to chat</a></p><section id="gate"><h1>secret secret passcode?</h1><form id="login"><input id="pass" type="password" required autocomplete="current-password" aria-label="Admin passcode"><button>enter</button></form></section><section id="panel" class="hidden"><h1>Chat moderation</h1><p class="muted">Delete messages or ban a message sender's network fingerprint. No raw IP addresses are displayed or stored. Bans can affect people sharing a network and may be evaded by changing networks.</p><h2>Banned fingerprints</h2><div id="bans"></div><h2>Messages</h2><div id="messages"></div></section><p id="status" class="error" role="status"></p></main></section><script>
const $=s=>document.querySelector(s);async function request(path,options){const r=await fetch(path,{credentials:"same-origin",cache:"no-store",...options});const j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}const post=(path,v)=>request(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});
function btn(text,action){const b=document.createElement("button");b.textContent=text;b.onclick=action;return b}async function action(payload){if(!confirm(payload.action==="delete"?"Permanently delete this message?":payload.action==="ban"?"Ban this sender?":"Unban this fingerprint?"))return;try{await post("/api/admin/action",payload);await load()}catch(e){$("#status").textContent=e.message}}
async function load(){try{const j=await request("/api/admin/list");$("#gate").classList.add("hidden");$("#panel").classList.remove("hidden");$("#status").textContent="";const banned=new Set(j.bans.map(b=>b.fp)),bs=$("#bans"),ms=$("#messages");bs.replaceChildren();ms.replaceChildren();if(!j.bans.length)bs.textContent="No bans";for(const b of j.bans){const el=document.createElement("div");el.className="entry";el.textContent=b.fp.slice(0,16)+"… ";el.append(btn("Unban",()=>action({action:"unban",fp:b.fp})));bs.append(el)}for(const m of j.messages){const el=document.createElement("div");el.className="entry";const body=document.createElement("div");body.textContent="#"+m.id+" · "+new Date(m.time).toLocaleString()+" · "+(m.filename?"[File] "+m.filename:m.body);el.append(body);const actions=document.createElement("div");actions.className="actions";actions.append(btn("Delete",()=>action({action:"delete",id:m.id})));if(m.fp){actions.append(btn(banned.has(m.fp)?"Banned":"Ban sender",()=>action({action:"ban",fp:m.fp})))}el.append(actions);ms.append(el)}}catch(e){if(e.message!=="Unauthorized")$("#status").textContent=e.message}}
$("#login").addEventListener("submit",async e=>{e.preventDefault();try{await post("/api/admin/login",{password:$("#pass").value});$("#pass").value="";await load()}catch(err){$("#status").textContent=err.message}});load();
</script></body></html>
