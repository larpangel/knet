<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7ff">
  <meta name="description" content="Kangel's little corner of the internet. Find @larpangel on YouTube, Twitch, X and Discord.">
  <title>K-Net — @larpangel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='80'%3E%E2%98%86%3C/text%3E%3C/svg%3E">
  <style>
    :root{color-scheme:light;--ink:#27385b;--muted:#7e8da9;--line:#dbe4f5;--blue:#7799dc;--paper:#ffffffc9}
    *{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}
    body{margin:0;min-height:100vh;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 10% 15%,#dce9ff 0,transparent 38%),radial-gradient(ellipse at 90% 85%,#e9e1ff 0,transparent 40%),#f8faff;display:grid;place-items:center;padding:54px 20px 32px}
    main{width:min(100%,455px);text-align:center;animation:enter .7s ease both}
    .tiny{font-size:11px;letter-spacing:.24em;color:#8999b7;text-transform:uppercase;margin:0 0 21px}
    .portrait{width:112px;height:112px;border-radius:50%;margin:auto;display:grid;place-items:center;background:linear-gradient(145deg,#edf4ff,#c9d9fb);border:5px solid white;box-shadow:0 8px 35px #99acd04d,0 0 0 1px #e1e7f6;position:relative}
    .portrait span{font-family:Georgia,serif;font-size:60px;color:#7294d2;line-height:1}
    .portrait:after{content:'✧';position:absolute;right:-12px;top:5px;font-size:26px;color:#8daee8}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,9vw,55px);font-weight:400;letter-spacing:-.045em;margin:19px 0 5px}
    .handle{margin:0;color:#7f9ac9;font-size:14px;letter-spacing:.03em}
    .bio{font-size:14px;line-height:1.9;color:#647694;margin:20px auto 27px;max-width:365px}
    .bio strong{font-weight:600;color:#516a9d}
    .links{display:grid;gap:11px}
    .link{display:flex;align-items:center;gap:12px;text-align:left;padding:17px 19px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--paper);border-radius:15px;box-shadow:0 3px 15px #a4b7d111;transition:transform .2s,border-color .2s,box-shadow .2s,background .2s}
    .link:hover,.link:focus-visible{transform:translateY(-3px);border-color:#9fb9ec;background:white;box-shadow:0 9px 24px #9eb6d02e;outline:none}
    .symbol{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:#edf2ff;color:#6486c2;font-size:16px;font-weight:700;flex-shrink:0}
    .name{font-size:15px;font-weight:600}.sub{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px}
    .arrow{margin-left:auto;color:#9baccb;font-size:19px}
    .divider{display:flex;align-items:center;gap:12px;margin:26px 0 20px;color:#a5b1ca;font-size:12px;letter-spacing:.12em}
    .divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}
    footer{font-size:12px;color:#9aaac3;margin-top:30px;line-height:1.9}
    footer a{color:#7894c5;text-decoration:none}footer a:hover{text-decoration:underline}
    @keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  </style>
  <style>
    @font-face{font-family:"PixelMplus";src:url("https://cdn.jsdelivr.net/gh/itouhiro/PixelMplus@master/PixelMplus12-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
    @font-face{font-family:"PixelMplus";src:url("https://cdn.jsdelivr.net/gh/itouhiro/PixelMplus@master/PixelMplus12-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
    @font-face{font-family:"Zpix";src:url("https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@master/dist/zpix.woff2") format("woff2");font-display:swap}
    html,body{font-family:"Zpix","PixelMplus",monospace!important}
    body{background:#f9e3fc url("/images/background.webp") center center / cover no-repeat fixed!important}
    h1,.tiny,.divider,.name{font-family:"PixelMplus","Zpix",monospace!important}
    h1{font-size:clamp(36px,8vw,49px);letter-spacing:0}
    .portrait{background:#fff url("/images/avatar.webp") center / cover no-repeat!important;overflow:visible}
    .portrait:after{display:none}
    .portrait span{display:none}
    .link{background:#fff9;border-radius:9px}
    .link:hover{background:#fffe}
    .tiny{font-size:15px;letter-spacing:.08em;color:#7c7da9}
    footer{font-family:"Zpix","PixelMplus",monospace}
    @media(max-width:600px){body{background-attachment:scroll!important;background-size:auto 100%!important;background-position:center center!important}}
  </style>
<style>.symbol img{display:block;width:26px;height:26px;object-fit:contain}.symbol{background:transparent}</style></head>
<body>
  <main>
    <p class="tiny">K-Net</p>
    <div class="portrait" aria-hidden="true"><span>☆</span></div>
    <h1>K-Net</h1>
    <p class="handle">@larpangel</p>
    <p class="bio">Pi-chan's strongest soldier!<br><strong>#1 larper in mediatok</strong> · savior of media literacy ♡</p>
    <nav class="links" aria-label="Find me online">
      <a class="link" href="https://www.youtube.com/@larpangel" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true"><img src="/images/youtube.png" alt=""></span><span class="name">YouTube<span class="sub">@larpangel</span></span><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="link" href="https://www.twitch.tv/larpangel" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true"><img src="/images/twitch.png" alt=""></span><span class="name">Twitch<span class="sub">@larpangel</span></span><span class="arrow" aria-hidden="true">↗</span></a>
      <a class="link" href="https://x.com/kawaiiangel" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true"><img src="/images/x.png" alt=""></span><span class="name">Twitter<span class="sub">@kawaiiangel</span></span><span class="arrow" aria-hidden="true">↗</span></a>
    </nav>
    <div class="divider">the community</div>
    <a class="link" href="https://discord.gg/pchan" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">♡</span><span class="name">Discord<span class="sub">.gg/pchan</span></span><span class="arrow" aria-hidden="true">↗</span></a>
    <footer>© <span id="year">2026</span> kangel.net · <a href="https://linktr.ee/larpangel" target="_blank" rel="noopener noreferrer">original linktree</a></footer>
  </main>
  <script>document.getElementById('year').textContent=new Date().getFullYear()</script>
</body>
</html>
